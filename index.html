<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandy Zhou | Tea, Culture, and Mindful Living</title>
  <meta name="description" content="Explore Sandy Zhou's original tea culture curriculum, programmes, cultural experiences, activities, and selected tea goods." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="#home" class="brand">Sandy Zhou</a>
      <div class="nav-actions">
        <nav class="nav" aria-label="Main navigation">
          <a href="#about"></a><a href="#portfolio"></a><a href="#programmes"></a>
          <a href="#activities"></a><a href="#products"></a><a href="#contact"></a>
        </nav>
        <button id="lang-btn" class="lang-btn" type="button">中文</button>
      </div>
      <button class="menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main>
    <section id="home" class="section hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="eyebrow" id="hero-eyebrow"></p><h1 id="hero-title"></h1>
          <p class="hero-subtitle" id="hero-subtitle"></p><p class="hero-zh" id="hero-zh"></p>
          <div class="button-row"><a id="hero-primary-link" class="btn btn-primary" href="#programmes"></a><a id="hero-secondary-link" class="btn btn-secondary" href="#contact"></a></div>
        </div>
        <div class="hero-image-wrap"><img src="assets/Sandy.png" alt="Tea, culture, and mindful living" class="hero-image" /></div>
        <a id="hero-signature-link" class="signature-shortcut" href="#signature"></a>
      </div>
    </section>

    <section id="about" class="section">
      <div class="container">
        <div class="about-text-block"><p class="eyebrow section-eyebrow"></p><h2 class="section-title"></h2><div id="about-copy"></div></div>
      </div>
      <div class="container principle-grid">
        <article class="principle-card"><p class="eyebrow" id="work-eyebrow"></p><h3 id="work-title"></h3><p id="work-copy"></p></article>
        <article class="principle-card"><p class="eyebrow" id="approach-eyebrow"></p><h3 id="approach-title"></h3><p id="approach-copy"></p></article>
      </div>
    </section>

    <section id="portfolio" class="section alt-bg">
      <div class="container"><p class="eyebrow section-eyebrow"></p><h2 class="section-title"></h2><p class="section-intro"></p><div class="method-strip" id="method-strip"></div><div class="portfolio-grid" id="portfolio-grid"></div></div>
    </section>

    <section id="programmes" class="section">
      <div class="container"><p class="eyebrow section-eyebrow"></p><h2 class="section-title"></h2><p class="section-intro"></p><article class="signature-card" id="signature"></article><div class="direction-grid" id="direction-grid"></div><div id="programme-detail" class="programme-detail" aria-live="polite"></div><div class="subsection-heading"><p class="eyebrow" id="scenarios-eyebrow"></p><h3 id="scenarios-title"></h3><p id="scenarios-intro"></p></div><div class="scenario-grid" id="scenario-grid"></div></div>
    </section>

    <section id="activities" class="section alt-bg">
      <div class="container"><p class="eyebrow section-eyebrow"></p><h2 class="section-title"></h2><p class="section-intro"></p><div class="activity-grid" id="activity-grid"></div><div class="feedback-block"><div><p class="eyebrow" id="feedback-eyebrow"></p><h3 id="feedback-title"></h3></div><div class="testimonial-grid" id="testimonial-grid"></div></div></div>
    </section>

    <section id="products" class="section">
      <div class="container"><p class="eyebrow section-eyebrow"></p><h2 class="section-title"></h2><p class="section-intro"></p><div class="product-grid" id="product-grid"></div></div>
    </section>

    <section id="contact" class="section alt-bg">
      <div class="container contact-wrap">
        <div><p class="eyebrow section-eyebrow"></p><h2 class="section-title"></h2><p class="contact-copy"></p><a id="form-link" class="btn btn-primary" href="https://forms.google.com" target="_blank" rel="noopener"></a><p class="form-note" id="form-note"></p></div>
        <div class="contact-card"><div id="contact-items"></div></div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="container footer-wrap"><div><p class="footer-brand">Sandy Zhou</p><p class="footer-tagline"></p></div><p class="footer-copy">© <span id="year"></span> Sandy Zhou. All rights reserved.</p></div></footer>
  <script src="data.js"></script><script src="content-config.js"></script><script src="script.js"></script>
</body>
</html>
